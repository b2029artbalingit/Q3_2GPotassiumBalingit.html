<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>View Sign-Ups</title>

<style>
body {
  background-color: #3a5a78;
  font-family: Arial, Helvetica, sans-serif;
  padding: 30px;
}

.container {
  background: #fffdf8;
  max-width: 900px;
  margin: auto;
  padding: 25px;
  border-radius: 12px;
  border: 2px solid #bfa76f;
}

h2 { color: #7b1e1e; }

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
}

th, td {
  border: 1px solid #bfa76f;
  padding: 8px;
  text-align: center;
}

th {
  background-color: #3a5a78;
  color: white;
}

select {
  padding: 6px;
}

a {
  display: inline-block;
  margin-top: 20px;
  color: #3a5a78;
  font-weight: bold;
}
</style>

<script>
let signups = JSON.parse(localStorage.getItem("signups")) || [];

function loadTable(filter = "all") {
  const tbody = document.getElementById("data");
  tbody.innerHTML = "";

  let filtered = filter === "all"
    ? signups
    : signups.filter(s => s.club === filter);

  document.getElementById("total").innerText = filtered.length;

  if (filtered.length === 0) {
    tbody.innerHTML = "<tr><td colspan='6'>No sign-ups found.</td></tr>";
    return;
  }

  filtered.forEach(s => {
    tbody.innerHTML += `
      <tr>
        <td>${s.studentID}</td>
        <td>${s.name}</td>
        <td>${s.grade}</td>
        <td>${s.status}</td>
        <td>${s.club}</td>
        <td>${s.email}</td>
      </tr>`;
  });
}
</script>
</head>

<body onload="loadTable()">

<div class="container">
  <h2>Student Sign-Ups</h2>

  <label>Filter by Club:
    <select onchange="loadTable(this.value)">
      <option value="all">All</option>
      <option value="LIKHA">LIKHA</option>
      <option value="ALIANTI">ALIANTI</option>
      <option value="SAGALA">SAGALA</option>
      <option value="COMPUTRON">COMPUTRON</option>
      <option value="HIMIG AGHAM">HIMIG AGHAM</option>
    </select>
  </label>

  <p>Total Sign-Ups: <strong id="total">0</strong></p>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Grade</th>
        <th>Status</th>
        <th>Club</th>
        <th>Email</th>
      </tr>
    </thead>
    <tbody id="data"></tbody>
  </table>

  <a href="signup.html">← Back to Sign-Up Page</a>
</div>

</body>
</html>
