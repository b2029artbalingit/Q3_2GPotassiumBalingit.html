<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View Sign-ups</title>

  <style>
    body {
  font-family: Arial, Helvetica, sans-serif;
  padding: 25px;
  background-color: #3a5a78;       
  color: #2b2b2b;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
  background-color: #fffdf8;        
  border: 2px solid #bfa76f;          
  box-shadow: 0 8px 20px rgba(31,42,68,0.25);
  border-radius: 6px;
  overflow: hidden;
}

th, td {
  border: 1px solid #bfa76f;         
  padding: 10px;
  text-align: center;
  font-size: 16px;
}

th {
  background: linear-gradient(
    to bottom,
    #1f2a44,
    #162033
  );                                 
  color: #fffdf8;
  font-weight: bold;
  letter-spacing: 0.5px;
}

tr:nth-child(even) {
  background-color: #faf7f2;       
}

tr:hover {
  background-color: #f1eadc;        
}

  </style>

  <script>
    function loadSignups() {
      const data = JSON.parse(localStorage.getItem("signUps"));

      const output = document.getElementById("output");
      const total = document.getElementById("total");

      if (!data || data.length === 0) {
        output.innerHTML = "<p>No sign-ups stored.</p>";
        total.innerText = "";
        return;
      }

      const filter = document.getElementById("filter").value;
      const filtered = filter === "ALL"
        ? data
        : data.filter(s => s.club === filter);

      if (filtered.length === 0) {
        output.innerHTML = "<p>No sign-ups for this club.</p>";
        total.innerText = "Total Sign-ups: 0";
        return;
      }

      let html = `
        <table>
          <tr>
            <th>Student ID</th>
            <th>Full Name</th>
            <th>Email</th>
            <th>Mobile No.</th>
            <th>Grade</th>
            <th>Club</th>
            <th>Status</th>
          </tr>
      `;

      filtered.forEach(s => {
        html += `
          <tr>
            <td>${s.student_id}</td>
            <td>${s.full_name}</td>
            <td>${s.email}</td>
            <td>${s.mobile}</td>
            <td>${s.grade_level}</td>
            <td>${s.club}</td>
            <td>${s.status}</td>
          </tr>
        `;
      });

      html += "</table>";

      output.innerHTML = html;
      total.innerText = "Total Sign-ups: " + filtered.length;
    }

    window.onload = loadSignups;
  </script>
</head>

<body>

<h2>Club Sign-ups</h2>

<label>
  Filter by Club:
  <select id="filter" onchange="loadSignups()">
    <option value="ALL">ALL</option>
    <option value="art">LIKHA (Digital & Visual Arts)</option>
    <option value="frisbee">ALIANTI (Frisbee)</option>
    <option value="dance">SAGALA (Dance)</option>
    <option value="baking">BAKE CLUB (Baking)</option>
    <option value="cs">COMPUTRON (Computer Science & IT)</option>
    <option value="Christians">ACTS (Christians)</option>
    <option value="englishtheatre">SIGHTLINES (English Theatre)</option>
    <option value="filipinotheatre">KAMALAYAN (Filipino Theatre)</option>
    <option value="mathematics">MATH CLUB (Mathematics)</option>
    <option value="glee">HIMIG AGHAM (Glee)</option>
  </select>
</label>

<div id="output"></div>
<p id="total"></p>

<a href="Q3_3GPotassiumBalingit.html">← Back to Sign-Up Page</a>

</body>
</html>
